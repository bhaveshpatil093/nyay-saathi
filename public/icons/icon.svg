  <line x1="400" y1="290" x2="448" y2="385" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" />
  <line x1="624" y1="290" x2="576" y2="385" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" />
  <line x1="624" y1="290" x2="672" y2="385" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" />
  <line x1="440" y1="505" x2="584" y2="505" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" />

