<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0B2545;
      color: #FFFFFF;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Noto Sans Devanagari", "Mukta", sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      text-align: center;
    }
    .card {
      background-color: #13315C;
      border: 1px solid rgba(255, 153, 51, 0.3);
      border-radius: 1.25rem;
      padding: 2rem 1.5rem;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4);
    }
    .logo {
      width: 80px;
      height: 80px;
      margin: 0 auto 1.25rem;
    }
    h1 {
      font-size: 1.25rem;
      font-weight: 700;
      color: #FFFFFF;
      margin-bottom: 0.5rem;
    }
    .badge {
      display: inline-block;
      background: rgba(255, 153, 51, 0.2);
      border: 1px solid #FF9933;
      color: #FF9933;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      margin-bottom: 1rem;
    }
    p {
      color: #B8C4D6;
      font-size: 0.875rem;
      line-height: 1.5;
      margin-bottom: 0.75rem;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background-color: #FF9933;
      color: #0B2545;
      font-weight: 700;
      font-size: 0.875rem;
      padding: 0.75rem 1.5rem;
      border-radius: 0.75rem;
      border: none;
      cursor: pointer;
      text-decoration: none;
      margin-top: 1rem;
      transition: background-color 0.15s ease;
      width: 100%;
    }
    .btn:hover {
      background-color: #E8851F;
    }
  </style>
</head>

</html>
